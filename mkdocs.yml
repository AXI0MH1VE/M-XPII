site_name: Axiom Hive XPII
site_description: A deterministic, audit-ready AI governance framework.
nav:
  - Home: index.md
  - Governance: governance.md
  - Workforce Models: workforce.md
  - Getting Started: GETTING_STARTED.md
  - Tutorials:
    - 01 First Workflow: TUTORIALS/01-FIRST-WORKFLOW.md
  - Examples:
    - E-commerce Optimization: EXAMPLES/ECOMMERCE-OPTIMIZATION.md

theme:
  name: material
  palette:
    scheme: slate
    primary: black
    accent: orange
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
